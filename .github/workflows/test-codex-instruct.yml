# Validate deployment and rollback behavior on the oldest and newest supported Python releases.
# The tests use temporary CODEX_HOME directories and never touch a runner user configuration.
# unit-tests intentionally cover project functionality only; prompt capability and
# scorer/bank verification live under scripts and are not part of this CI verdict.
name: Test codex-instruct

# Run when deployment behavior, Star History data/render behavior, tests, or this workflow changes.
on:
  pull_request:
    paths:
      - "codex-instruct.py"
      - "sync-archives.py"
      - ".github/scripts/star_history.py"
      - ".github/data/star-history-data.json"
      - "unit-tests/**"
      - ".github/workflows/test-codex-instruct.yml"
  push:
    branches:
      - main
    paths:
      - "codex-instruct.py"
      - "sync-archives.py"
      - ".github/scripts/star_history.py"
      - ".github/data/star-history-data.json"
      - "unit-tests/**"
      - ".github/workflows/test-codex-instruct.yml"
  workflow_dispatch:

# The test job only needs to read the checked-out repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Keep both matrix jobs running so a compatibility failure is visible independently.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Python 3.8-3.10 use tomli; newer Python versions use the standard-library tomllib.
      - name: Install test compatibility dependency
        run: python -m pip install tomli

      # Catch syntax/import compatibility problems before running behavioral tests.
      - name: Compile deployment script and tests
        run: >-
          python -m py_compile
          codex-instruct.py
          sync-archives.py
          .github/scripts/star_history.py
          unit-tests/*.py

      # Exercise config ownership, safe reset, snapshot recovery, and file-preservation cases.
      - name: Run unit tests
        run: python -m unittest discover -s unit-tests -q

      # The doctor step is the regression gate for the failure that made earlier
      # releases inert: config.toml pointing at a prompt the deploy never wrote.
      - name: Deploy, diagnose, and roll back the packaged release
        run: |
          codex_home="$RUNNER_TEMP/codex-home"
          mkdir -p "$codex_home"
          printf 'model = "gpt-6-astra"\nmodel_provider = "custom"\n' > "$codex_home/config.toml"

          python codex-instruct.py --apply --codex-dir "$codex_home"
          grep -q 'model_instructions_file = "./gpt-6.1-sol-v2.md"' "$codex_home/config.toml"
          python codex-instruct.py --doctor --codex-dir "$codex_home"

          printf 'y\n' | python codex-instruct.py --reset --codex-dir "$codex_home"
          test ! -e "$codex_home/gpt-6.1-sol-v2.md"
          grep -q '^model = "gpt-6-astra"$' "$codex_home/config.toml"
          ! grep -q 'model_instructions_file' "$codex_home/config.toml"
